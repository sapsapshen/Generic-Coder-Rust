[package]
name = "generic-coder"
version = "0.1.0"
edition = "2021"
description = "Generic Coder autonomous development cockpit - Rust rewrite"
license = "MIT"

[[bin]]
name = "generic-coder"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio-tungstenite = "0.26"
futures = "0.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
scraper = "0.22"
ssh2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
sha2 = "0.10"
glob = "0.3"
dirs = "6"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
zip = "2"
tar = "0.4"
flate2 = "1"
bytes = "1"
parking_lot = "0.12"
lazy_static = "1.5"
rfd = "0.15"

# Media file processing
lopdf = { version = "0.34", optional = true }
calamine = { version = "0.26", optional = true }

[features]
default = []
media = ["lopdf", "calamine"]
