<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generic Coder Workbench</title>
    <link rel="icon" type="image/x-icon" href="/static/icon.ico" />
    <link rel="stylesheet" href="/static/vendor/codicons/codicon.css" />
    <link rel="stylesheet" href="/static/app.css" />
    <script>
      try {
        const theme = window.localStorage.getItem('generic-coder-theme');
        if (theme) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <script src="/static/vendor/monaco/vs/loader.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;inset:0;background:#1a0000;color:#ff8080;padding:24px;font:14px monospace;z-index:9999;white-space:pre-wrap;overflow:auto;';
        div.textContent = 'Workbench JS Error:\n' + ((e.error && e.error.stack) || e.message || String(e));
        document.body.appendChild(div);
      });
    </script>
    <script src="/static/app.js"></script>
  </body>
</html>
